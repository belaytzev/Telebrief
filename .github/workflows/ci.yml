name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Cache pre-commit hooks
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit vulture

    - name: Run pre-commit hooks
      run: pre-commit run --all-files --show-diff-on-failure

    - name: Find unused code
      run: vulture src vulture_whitelist.py --min-confidence 80

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: '3.14'
        enable-cache: true

    - name: Install locked dependencies
      run: uv sync --frozen --extra dev

    - name: Run pytest
      run: uv run pytest --cov=src --cov-report=term-missing

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Cache pre-commit hooks
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pre-commit-

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit pip-audit

    - name: Run Bandit via pre-commit
      run: pre-commit run bandit --all-files

    - name: Audit locked dependencies
      run: |
        uv export --frozen --no-emit-project --no-dev -o locked-requirements.txt
        pip-audit -r locked-requirements.txt --disable-pip --require-hashes --progress-spinner off

  website-build:
    name: Website Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: website/package-lock.json

    - name: Install website dependencies
      run: npm ci
      working-directory: website

    - name: Build website
      run: npm run build
      working-directory: website

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        tags: telebrief:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test image
      run: docker run --rm telebrief:ci python -c "import main, src.setup_wizard, src.mcp_server"
